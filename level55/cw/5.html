<!--5. რთული ანიმაცია
- შექმენით 150x150px კვადრატი.
- გამოიყენეთ @keyframes.
- ანიმაციის დროს:
  - 0% — წითელი, საწყისი პოზიცია.
  - 25% — ყვითელი, დატრიალდეს 90 გრადუსით.
  - 50% — მწვანე, გადაადგილდეს მარჯვნივ 200px-ით.
  - 75% — ლურჯი, დატრიალდეს 270 გრადუსით.
  - 100% — დაბრუნდეს საწყის პოზიციაზე და გახდეს წითელი.
- ანიმაცია გრძელდებოდეს 6 წამი და მეორდებოდეს უსასრულოდ.
დამატებითი პირობა: ყველა დავალებაში გამოიყენეთ ცალკე @keyframes და animation-name, animation-duration, animation-iteration-count თვისებები.-->
